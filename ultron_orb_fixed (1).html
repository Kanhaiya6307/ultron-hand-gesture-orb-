<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ULTRON ORB — Hand Tracking</title>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
          crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      color: #ff8a00;
    }

    #app {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 90, 0, .035), transparent 42%),
        #000;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #videoElement {
      display: none;
    }

    #ui {
      position: fixed;
      z-index: 10;
      top: 22px;
      left: 22px;
      right: 22px;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 12px rgba(255, 90, 0, .25);
    }

    #title {
      margin: 0 0 14px;
      font-size: clamp(22px, 5vw, 34px);
      letter-spacing: 5px;
      color: #ff8a00;
    }

    #status {
      margin: 5px 0;
      font-size: 12px;
      color: #d36d00;
    }

    #hint {
      margin-top: 10px;
      max-width: 620px;
      line-height: 1.7;
      font-size: 10px;
      color: #9b4f00;
    }

    #startButton {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      border: 1px solid #b85b00;
      border-radius: 8px;
      padding: 13px 22px;
      background: rgba(10, 5, 0, .9);
      color: #ff8a00;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(255, 80, 0, .12);
    }

    #startButton:active {
      transform: translateX(-50%) scale(.97);
    }

    #error {
      display: none;
      position: fixed;
      z-index: 30;
      left: 18px;
      right: 18px;
      bottom: 90px;
      padding: 14px;
      border: 1px solid #6d2600;
      border-radius: 8px;
      background: rgba(15, 3, 0, .95);
      color: #ff9b4a;
      font-size: 12px;
      line-height: 1.55;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: #7a3500;
      box-shadow: 0 0 8px #7a3500;
    }

    .active {
      background: #ff7200;
      box-shadow: 0 0 10px #ff7200;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <div id="ui">
    <h1 id="title">ULTRON ORB</h1>
    <div id="status"><span class="dot"></span>Waiting for camera permission...</div>
    <div id="hint">
      THUMB ↔ INDEX = ORB EXPANSION<br>
      PINCH TO COLLAPSE • OPEN HAND TO EXPAND
    </div>
  </div>

  <video id="videoElement" autoplay muted playsinline></video>

  <button id="startButton">ENABLE CAMERA</button>
  <div id="error"></div>

  <script>
    // ============================================================
    // ULTRON ORB
    // Important:
    // getUserMedia() requires a secure context:
    // HTTPS or localhost. Opening this HTML as content:// or file://
    // can cause "NotAllowedError: Permission denied".
    // ============================================================

    const app = document.getElementById("app");
    const video = document.getElementById("videoElement");
    const statusEl = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const errorEl = document.getElementById("error");

    let stream = null;
    let trackingStarted = false;

    function setStatus(text, active = false) {
      statusEl.innerHTML =
        `<span class="dot ${active ? "active" : ""}"></span>${text}`;
    }

    function showError(message) {
      errorEl.style.display = "block";
      errorEl.textContent = message;
    }

    function hideError() {
      errorEl.style.display = "none";
    }

    // ---------- THREE.JS ----------
    const scene = new THREE.Scene();

    const threeCamera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    threeCamera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    app.appendChild(renderer.domElement);

    // ---------- PARTICLE ORB ----------
    const particleCount = 6000;
    const geometry = new THREE.BufferGeometry();

    const positions = new Float32Array(particleCount * 3);
    const basePositions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      // Uniform distribution inside a spherical shell.
      const radius = 1.5 * Math.cbrt(Math.random());
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);

      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.sin(phi) * Math.sin(theta);
      const z = radius * Math.cos(phi);

      const i3 = i * 3;

      positions[i3] = x;
      positions[i3 + 1] = y;
      positions[i3 + 2] = z;

      basePositions[i3] = x;
      basePositions[i3 + 1] = y;
      basePositions[i3 + 2] = z;
    }

    geometry.setAttribute(
      "position",
      new THREE.BufferAttribute(positions, 3)
    );

    const material = new THREE.PointsMaterial({
      color: 0xff7800,
      size: 0.026,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });

    const orb = new THREE.Points(geometry, material);
    scene.add(orb);

    // Extra wireframe rings for a more HUD-like appearance.
    const ringGroup = new THREE.Group();
    scene.add(ringGroup);

    function addRing(radius, rotationX, rotationY) {
      const ringGeometry = new THREE.TorusGeometry(
        radius,
        0.006,
        8,
        160
      );

      const ringMaterial = new THREE.MeshBasicMaterial({
        color: 0xff5f00,
        transparent: true,
        opacity: 0.25,
        blending: THREE.AdditiveBlending
      });

      const ring = new THREE.Mesh(ringGeometry, ringMaterial);
      ring.rotation.x = rotationX;
      ring.rotation.y = rotationY;
      ringGroup.add(ring);
    }

    addRing(1.65, 0, 0);
    addRing(1.65, Math.PI / 2, 0);
    addRing(1.65, Math.PI / 4, Math.PI / 5);

    let targetScale = 1;
    let currentScale = 1;
    let handX = 0.5;
    let handY = 0.5;

    // ---------- MEDIAPIPE ----------
    const hands = new Hands({
      locateFile: file =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.55,
      minTrackingConfidence: 0.55
    });

    hands.onResults(results => {
      if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
      ) {
        const hand = results.multiHandLandmarks[0];

        const thumb = hand[4];
        const index = hand[8];

        const dx = thumb.x - index.x;
        const dy = thumb.y - index.y;
        const distance = Math.hypot(dx, dy);

        // Clamp the input so extreme values don't make the orb huge.
        const normalized = Math.min(Math.max(distance, 0.02), 0.32);

        targetScale = THREE.MathUtils.mapLinear(
          normalized,
          0.02,
          0.32,
          0.55,
          2.15
        );

        handX = hand[0].x;
        handY = hand[0].y;

        setStatus("HAND TRACKING ACTIVE", true);
      } else {
        targetScale = 1;
        setStatus("SEARCHING FOR HAND...", false);
      }
    });

    // ---------- CAMERA ----------
    async function startCamera() {
      hideError();

      // This is the main cause of the error in the screenshot.
      if (!window.isSecureContext) {
        setStatus("INSECURE PAGE — CAMERA BLOCKED");
        showError(
          "Camera access requires HTTPS or localhost. " +
          "Do not open this HTML directly from a content:// or file:// URL. " +
          "Run it through a local HTTPS/localhost server, then press ENABLE CAMERA."
        );
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("CAMERA API NOT AVAILABLE");
        showError(
          "This browser does not expose getUserMedia(). " +
          "Try the latest Chrome or Brave and make sure camera access is enabled."
        );
        return;
      }

      startButton.disabled = true;
      startButton.textContent = "REQUESTING CAMERA...";

      try {
        // Request permission from a user click.
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "user" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        setStatus("CAMERA READY — LOADING HAND TRACKER", true);

        if (!trackingStarted) {
          trackingStarted = true;
          processVideo();
        }

        startButton.style.display = "none";
      } catch (err) {
        console.error(err);

        startButton.disabled = false;
        startButton.textContent = "TRY CAMERA AGAIN";

        let message = "Camera could not be started.";

        if (err.name === "NotAllowedError") {
          message =
            "Chrome/Brave denied camera permission. " +
            "Allow Camera for this website in the browser's site permissions, " +
            "then reload the page and press ENABLE CAMERA.";
        } else if (err.name === "NotFoundError") {
          message =
            "No camera was found. Check that your device has a working camera.";
        } else if (err.name === "NotReadableError") {
          message =
            "The camera is already being used by another app. Close apps using the camera and try again.";
        } else if (err.name === "SecurityError") {
          message =
            "The browser blocked camera access for security reasons. Use HTTPS or localhost.";
        }

        setStatus("CAMERA ERROR");
        showError(message + ` [${err.name || "UnknownError"}]`);
      }
    }

    async function processVideo() {
      if (!trackingStarted) return;

      if (video.readyState >= 2) {
        try {
          await hands.send({ image: video });
        } catch (err) {
          console.warn("MediaPipe frame error:", err);
        }
      }

      requestAnimationFrame(processVideo);
    }

    startButton.addEventListener("click", startCamera);

    // ---------- ANIMATION ----------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();

      currentScale += (targetScale - currentScale) * 0.08;

      orb.scale.setScalar(currentScale);
      ringGroup.scale.setScalar(currentScale);

      // Ambient rotation.
      orb.rotation.y += 0.0035;
      orb.rotation.z += 0.0015;

      ringGroup.rotation.y -= 0.002;
      ringGroup.rotation.x += 0.0007;

      // Gentle particle breathing without accumulating position errors.
      const pos = geometry.attributes.position.array;

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;

        const bx = basePositions[i3];
        const by = basePositions[i3 + 1];
        const bz = basePositions[i3 + 2];

        const pulse =
          1 +
          Math.sin(time * 2.0 + i * 0.035) * 0.018 +
          Math.sin(time * 0.7 + i * 0.01) * 0.008;

        pos[i3] = bx * pulse;
        pos[i3 + 1] = by * pulse;
        pos[i3 + 2] = bz * pulse;
      }

      geometry.attributes.position.needsUpdate = true;

      renderer.render(scene, threeCamera);
    }

    animate();

    // ---------- RESIZE ----------
    window.addEventListener("resize", () => {
      threeCamera.aspect = window.innerWidth / window.innerHeight;
      threeCamera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    // ---------- CLEANUP ----------
    window.addEventListener("beforeunload", () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>
